<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ezelex Enterprise - Worker Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f4f6f8;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 35px 28px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.10);
    }

    .brand {
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      color: #111827;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 16px;
      margin-bottom: 17px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    .login-btn {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 9px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 9px;
      line-height: 1.4;
      font-size: 14px;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .home {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      color: #777;
      font-size: 12px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

<div class="login-card">

  <div class="brand">
    Ezelex Enterprise
  </div>

  <div class="subtitle">
    Worker Portal
  </div>

  <form id="loginForm">

    <label for="email">
      Email
    </label>

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      required
    >

    <label for="password">
      Password
    </label>

    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      required
    >

    <button
      type="submit"
      class="login-btn"
      id="loginButton"
    >
      Worker Login
    </button>

  </form>

  <div
    id="message"
    class="message"
  ></div>

  <a
    class="home"
    href="https://ezelexenterprise.com"
  >
    Back to Ezelex Enterprise
  </a>

  <div class="footer">
    © 2026 Ezelex Enterprise
  </div>

</div>

<script>

  const SUPABASE_URL =
    "https://hweczhwoggmsrwhkktrx.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_D0o90HRJ1AfROf_DAj7ZAg_uaPDwqvV";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  const form =
    document.getElementById("loginForm");

  const button =
    document.getElementById("loginButton");

  const message =
    document.getElementById("message");


  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;

    message.style.display =
      "block";
  }


  form.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;

      button.disabled = true;

      button.textContent =
        "Signing in...";

      message.style.display =
        "none";


      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });


        if (error) {

          showMessage(
            error.message,
            "error"
          );

          button.disabled = false;

          button.textContent =
            "Worker Login";

          return;
        }


        if (!data.user) {

          showMessage(
            "Login could not be completed. Please try again.",
            "error"
          );

          button.disabled = false;

          button.textContent =
            "Worker Login";

          return;
        }


        showMessage(
          "Login successful. Opening your worker profile...",
          "success"
        );


        setTimeout(
          function() {

            window.location.href =
              "https://ezelexenterprise.com/worker-profile.html";

          },
          700
        );

      }

      catch (error) {

        console.error(error);

        showMessage(
          "Unable to connect. Please try again.",
          "error"
        );

        button.disabled = false;

        button.textContent =
          "Worker Login";
      }

    }
  );

</script>

</body>
</html>
