<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ezelex Enterprise - Worker Portal</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#1f2937;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.container{width:100%;max-width:430px;padding:20px}
.card{
  background:#fff;
  border-radius:16px;
  padding:30px;
  box-shadow:0 8px 30px rgba(0,0,0,.10);
}
.logo{text-align:center;margin-bottom:25px}
.logo h1{margin:0;color:#111827;font-size:28px}
.logo p{margin:7px 0 0;color:#6b7280}
h2{text-align:center;margin:0 0 22px}
label{display:block;font-weight:bold;margin:14px 0 7px}
input{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:8px;
  font-size:16px;
}
input:focus{outline:none;border-color:#2563eb}
button{
  width:100%;
  margin-top:22px;
  padding:14px;
  border:0;
  border-radius:8px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{opacity:.6;cursor:not-allowed}
.message{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  font-size:14px;
}
.error{display:block;background:#fee2e2;color:#b91c1c}
.success{display:block;background:#dcfce7;color:#166534}
.home{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#2563eb;
  text-decoration:none;
  font-weight:bold;
}
.small{text-align:center;color:#6b7280;font-size:13px;margin-top:18px}
</style>
</head>

<body>
<div class="container">
  <div class="card">

    <div class="logo">
      <h1>Ezelex Enterprise</h1>
      <p>Worker Portal</p>
    </div>

    <h2>Worker Login</h2>

    <form id="loginForm">
      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginBtn">Login</button>

      <div id="message" class="message"></div>
    </form>

    <a class="home" href="https://ezelexenterprise.com">
      Back to Ezelex Enterprise
    </a>

    <div class="small">
      Ezelex Enterprise Worker Access
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://hweczhwoggmsrwhkktrx.supabase.co";
const SUPABASE_KEY = "sb_publishable_D0o90HRJ1AfROf_DAj7ZAg_uaPDwqvV";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const form = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  message.className = "message";
  message.textContent = "";
  loginBtn.disabled = true;
  loginBtn.textContent = "Logging in...";

  try {
    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      throw error;
    }

    if (!data.user) {
      throw new Error("Login was not completed.");
    }

    message.className = "message success";
    message.textContent = "Login successful. Opening your worker profile...";

    setTimeout(() => {
      window.location.href =
        "https://ezelexenterprise.com/worker-profile.html";
    }, 500);

  } catch (error) {
    console.error(error);

    message.className = "message error";

    if (error.message) {
      message.textContent = error.message;
    } else {
      message.textContent =
        "Login failed. Please check your email and password.";
    }

    loginBtn.disabled = false;
    loginBtn.textContent = "Login";
  }
});
</script>

</body>
</html>
