<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ezelex Enterprise — Create Your Password</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;color:#1f2937}
header{background:#111827;color:#fff;padding:28px 20px;text-align:center}
header h1{margin:0;font-size:28px}
header p{margin:8px 0 0;color:#d1d5db}
.card{max-width:520px;margin:45px auto;background:#fff;padding:30px;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
h2{margin-top:0}
label{display:block;font-weight:bold;margin:18px 0 7px}
input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:8px;font-size:16px}
button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:8px;background:#111827;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}
button:hover{opacity:.92}
.msg{margin:15px 0;padding:12px;border-radius:8px}
.error{background:#fee2e2;color:#991b1b}
.ok{background:#dcfce7;color:#166534}
.info{background:#eef2ff;color:#3730a3}
.hidden{display:none}
.small{font-size:13px;color:#6b7280;line-height:1.5}
</style>
</head>
<body>
<header>
  <h1>Ezelex Enterprise</h1>
  <p>Worker Account Security</p>
</header>

<div class="card">
  <h2 id="title">Create Your Password</h2>
  <p id="intro">Choose your own password for your Ezelex Enterprise worker account.</p>
  <div id="msg" class="hidden"></div>

  <div id="form">
    <label for="password">New Password</label>
    <input id="password" type="password" autocomplete="new-password" placeholder="Enter your new password">

    <label for="confirm">Confirm Password</label>
    <input id="confirm" type="password" autocomplete="new-password" placeholder="Enter your password again">

    <button id="saveBtn">Create Password</button>
  </div>

  <p class="small">
    Your password must be at least 8 characters. Keep it private and do not share it with anyone.
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://hweczhwoggmsrwhkktrx.supabase.co";
const SUPABASE_KEY="sb_publishable_D0o90HRJ1AfROf_DAj7ZAg_uaPDwqvV";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=id=>document.getElementById(id);

function show(text,type){
  $("msg").className="msg "+type;
  $("msg").textContent=text;
  $("msg").classList.remove("hidden");
}

async function init(){
  const hash=window.location.hash;
  const params=new URLSearchParams(hash.replace(/^#/,""));
  const error=params.get("error_description") || params.get("error");
  if(error){
    show(decodeURIComponent(error.replace(/\+/g," ")),"error");
    return;
  }

  const {data:{session}}=await db.auth.getSession();

  if(!session){
    show("This password link is missing or has expired. Please use Forgot Password from the Ezelex Worker Portal to request a new link.","error");
    return;
  }

  $("saveBtn").onclick=async()=>{
    const password=$("password").value;
    const confirm=$("confirm").value;

    if(password.length<8){
      show("Password must be at least 8 characters.","error");
      return;
    }
    if(password!==confirm){
      show("Passwords do not match.","error");
      return;
    }

    $("saveBtn").disabled=true;
    $("saveBtn").textContent="Saving...";

    const {error}=await db.auth.updateUser({password});

    if(error){
      show(error.message,"error");
      $("saveBtn").disabled=false;
      $("saveBtn").textContent="Create Password";
      return;
    }

    show("Your password has been created successfully. You can now sign in to the Worker Portal.","ok");
    $("form").classList.add("hidden");

    setTimeout(()=>{
      location.href="https://ezelexenterprise.com/EZELEX_WORKER_PORTAL.html";
    },1500);
  };
}

init();
</script>
</body>
</html>
