<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EZELEX Worker Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6f8;color:#17202a}
header{background:#111827;color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center}
button{border:0;border-radius:8px;padding:11px 15px;font-weight:700;cursor:pointer}
.primary{background:#111827;color:white}.danger{background:#b42318;color:white}
.wrap,.login{max-width:1100px;margin:25px auto;padding:0 15px}.login{max-width:430px;background:white;padding:25px;border-radius:12px}
.panel{background:white;padding:22px;border-radius:12px;margin-bottom:18px;box-shadow:0 3px 15px #0000000d}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}
input,select,textarea{width:100%;padding:11px;border:1px solid #d5dbe1;border-radius:8px;margin:6px 0 12px}
label{font-weight:700;font-size:13px}.hidden{display:none!important}
.msg{padding:10px;border-radius:8px;margin:10px 0;background:#fef3c7}.error{background:#fee4e2;color:#912018}.success{background:#dcfae6;color:#067647}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;padding:16px;border-radius:12px}
.value{font-size:24px;font-weight:800;margin-top:7px}
.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:800px}
th,td{padding:11px;border-bottom:1px solid #eee;text-align:left}th{background:#f8fafc}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;font-size:12px;font-weight:700}
.pending{background:#fff3cd;color:#856404}.approved{background:#dcfae6;color:#067647}.rejected{background:#fee4e2;color:#912018}
@media(max-width:700px){.grid,.cards{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header>
<h1>EZELEX Worker Portal</h1>
<button id="logout" class="danger hidden">Log out</button>
</header>

<section id="login" class="login">
<h2>Worker Login</h2><div id="loginMsg"></div>
<label>Email</label><input id="email" type="email">
<label>Password</label><input id="password" type="password">
<button id="loginBtn" class="primary" style="width:100%">Sign in</button>
</section>

<main id="app" class="wrap hidden">
<section class="panel">
<h2>Welcome, <span id="name">Worker</span> 👋</h2>
<p>Worker ID: <strong id="wid">—</strong></p>
<p>Role: <strong id="role">Worker</strong></p>
<p>Contract ends: <strong id="contract">—</strong></p>
</section>

<div class="cards">
<div class="card">Pending<div class="value" id="pendingCount">0</div></div>
<div class="card">Approved<div class="value" id="approvedCount">0</div></div>
<div class="card">Rejected<div class="value" id="rejectedCount">0</div></div>
</div>

<section class="panel" style="margin-top:18px">
<h2>Record a Sale</h2><div id="saleMsg"></div>
<form id="saleForm" class="grid">
<div><label>Sale Date</label><input id="saleDate" type="date" required></div>
<div><label>Customer / Reference</label><input id="customer"></div>
<div><label>Product / Service</label><input id="product" required></div>
<div><label>Quantity</label><input id="quantity" type="number" min="1" value="1" required></div>
<div><label>Sale Amount (GHS)</label><input id="amount" type="number" min="0" step="0.01" required></div>
<div><label>Payment Method</label><select id="payment" required><option value="">Select</option><option>Cash</option><option>Mobile Money</option><option>Bank Transfer</option><option>Card</option><option>Other</option></select></div>
<div class="full"><label>Notes</label><textarea id="notes"></textarea></div>
<div class="full"><button class="primary">Record Sale</button></div>
</form>
</section>

<section class="panel">
<h2>My Sales History</h2>
<div class="table"><table>
<thead><tr><th>Date</th><th>Product</th><th>Customer</th><th>Qty</th><th>Amount</th><th>Status</th><th>Reason</th></tr></thead>
<tbody id="body"></tbody>
</table></div>
</section>
</main>

<script>
const URL="https://hweczhwoggmsrwhkktrx.supabase.co";
const KEY="sb_publishable_D0o90HRJ1AfROf_DAj7ZAg_uaPDwqvV";
const db=supabase.createClient(URL,KEY);
let profile=null;
const $=x=>document.getElementById(x);
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function today(){let d=new Date();return d.toISOString().slice(0,10)}
function message(id,t,c=""){ $(id).innerHTML=t?`<div class="msg ${c}">${esc(t)}</div>`:""; }

async function start(){
 const {data:{session}}=await db.auth.getSession();
 if(session) await profileLoad(session.user.id); else showLogin();
}
function showLogin(){
 $("login").classList.remove("hidden");$("app").classList.add("hidden");$("logout").classList.add("hidden");
}
async function profileLoad(id){
 const {data,error}=await db.from("worker_profiles")
 .select("id,worker_id,full_name,role,active,contract_end").eq("id",id).maybeSingle();
 if(error||!data||!data.active||data.role==="admin"){
   await db.auth.signOut();showLogin();message("loginMsg","This is not an active worker account.","error");return;
 }
 profile=data;
 $("login").classList.add("hidden");$("app").classList.remove("hidden");$("logout").classList.remove("hidden");
 $("name").textContent=data.full_name||"Worker";$("wid").textContent=data.worker_id||"—";
 $("role").textContent=data.role||"worker";$("contract").textContent=data.contract_end||"—";
 $("saleDate").value=today();loadSales();
}
async function loadSales(){
 const {data,error}=await db.from("sales").select("*").eq("worker_id",profile.id).order("sale_date",{ascending:false});
 if(error){message("saleMsg",error.message,"error");return}
 let rows=data||[];
 $("pendingCount").textContent=rows.filter(x=>x.status==="pending").length;
 $("approvedCount").textContent=rows.filter(x=>(x.status||"approved")==="approved").length;
 $("rejectedCount").textContent=rows.filter(x=>x.status==="rejected").length;
 $("body").innerHTML=rows.length?rows.map(s=>{
  let st=s.status||"approved";
  return `<tr><td>${esc(String(s.sale_date||"").slice(0,10))}</td>
  <td>${esc(s.product_service)}</td><td>${esc(s.customer_reference)}</td>
  <td>${esc(s.quantity)}</td><td>GHS ${Number(s.sale_amount||0).toFixed(2)}</td>
  <td><span class="badge ${st}">${esc(st)}</span></td>
  <td>${esc(s.rejection_reason||"")}</td></tr>`;
 }).join(""):'<tr><td colspan="7">No sales recorded yet.</td></tr>';
}
$("loginBtn").onclick=async()=>{
 message("loginMsg","Signing in...");
 let {data,error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
 if(error)message("loginMsg",error.message,"error");else profileLoad(data.user.id);
};
$("logout").onclick=async()=>{await db.auth.signOut();profile=null;showLogin()};
$("saleForm").onsubmit=async e=>{
 e.preventDefault();message("saleMsg","Saving sale...");
 let sale={worker_id:profile.id,sale_date:$("saleDate").value,customer_reference:$("customer").value.trim()||null,
 product_service:$("product").value.trim(),quantity:Number($("quantity").value),sale_amount:Number($("amount").value),
 payment_method:$("payment").value,notes:$("notes").value.trim()||null,status:"pending"};
 let {error}=await db.from("sales").insert(sale);
 if(error){message("saleMsg",error.message,"error");return}
 message("saleMsg","Sale submitted. It is now pending administrator approval.","success");
 $("saleForm").reset();$("saleDate").value=today();$("quantity").value=1;loadSales();
};
start();
</script>
</body>
</html>
