<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EZELEX Worker Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}
header{background:#111827;color:#fff;padding:22px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px}
header h1{margin:0;font-size:23px}
button{border:0;border-radius:8px;padding:12px 16px;cursor:pointer;font-weight:700}
.primary{background:#111827;color:#fff}.danger{background:#b42318;color:#fff}
.login{max-width:430px;margin:60px auto;background:#fff;padding:30px;border-radius:14px;box-shadow:0 8px 30px #0001}
.wrap{max-width:1050px;margin:30px auto;padding:0 18px}
.panel{background:#fff;padding:22px;border-radius:12px;margin-bottom:20px;box-shadow:0 3px 15px #0000000d}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
label{font-weight:700;font-size:14px;display:block}
input,select,textarea{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #d5dbe1;border-radius:8px;font-size:15px}
textarea{min-height:90px;resize:vertical}
.full{grid-column:1/-1}
.msg{padding:10px;border-radius:8px;margin:10px 0;background:#fef3c7}
.error{background:#fee4e2;color:#912018}
.success{background:#dcfae6;color:#067647}
.workerInfo{font-size:14px;line-height:1.6}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{padding:12px;border-bottom:1px solid #eee;text-align:left;font-size:14px}
th{background:#f8fafc}
.tablebox{overflow:auto}
.hidden{display:none}
@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.login{margin:30px 15px}.wrap{padding:0 12px}}
</style>
</head>
<body>

<header>
  <h1>EZELEX Worker Portal</h1>
  <button id="logoutBtn" class="danger hidden">Log out</button>
</header>

<section id="loginSection" class="login">
  <h2>Worker Login</h2>
  <p>Sign in with your EZELEX worker account.</p>
  <div id="loginMsg"></div>
  <label>Email</label>
  <input id="email" type="email" placeholder="Worker email">
  <label>Password</label>
  <input id="password" type="password" placeholder="Password">
  <button id="loginBtn" class="primary" style="width:100%">Sign in</button>
</section>

<main id="portal" class="wrap hidden">
  <div class="panel">
    <h2>Welcome, <span id="workerName">Worker</span></h2>
    <div class="workerInfo">
      <strong>Worker ID:</strong> <span id="workerId">—</span><br>
      <strong>Role:</strong> <span id="workerRole">—</span>
    </div>
  </div>

  <div class="panel">
    <h2>Record a Sale</h2>
    <div id="saleMsg"></div>
    <form id="saleForm" class="grid">
      <div>
        <label>Sale Date</label>
        <input id="saleDate" type="date" required>
      </div>
      <div>
        <label>Customer / Reference</label>
        <input id="customer" type="text" placeholder="Customer name or reference">
      </div>
      <div>
        <label>Product / Service</label>
        <input id="product" type="text" placeholder="What was sold?" required>
      </div>
      <div>
        <label>Quantity</label>
        <input id="quantity" type="number" min="1" step="1" value="1" required>
      </div>
      <div>
        <label>Sale Amount (GHS)</label>
        <input id="amount" type="number" min="0" step="0.01" placeholder="0.00" required>
      </div>
      <div>
        <label>Payment Method</label>
        <select id="payment" required>
          <option value="">Select payment method</option>
          <option>Cash</option>
          <option>Mobile Money</option>
          <option>Bank Transfer</option>
          <option>Card</option>
          <option>Other</option>
        </select>
      </div>
      <div class="full">
        <label>Notes</label>
        <textarea id="notes" placeholder="Optional notes"></textarea>
      </div>
      <div class="full">
        <button class="primary" type="submit">Record Sale</button>
      </div>
    </form>
  </div>

  <div class="panel">
    <h2>My Sales History</h2>
    <div class="tablebox">
      <table>
        <thead>
          <tr><th>Date</th><th>Customer</th><th>Product/Service</th><th>Qty</th><th>Amount (GHS)</th><th>Payment</th><th>Notes</th></tr>
        </thead>
        <tbody id="salesBody"><tr><td colspan="7">No sales recorded yet.</td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<script>
const SUPABASE_URL = "https://hweczhwoggmsrwhkktrx.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_D0o90HRJ1AfROf_DAj7ZAg_uaPDwqvV";
const {createClient} = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let profile = null;

const $ = id => document.getElementById(id);
function msg(id,text,type=""){ $(id).innerHTML=text ? `<div class="msg ${type}">${text}</div>` : ""; }
function today(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

async function start(){
  const {data:{session}}=await db.auth.getSession();
  if(!session){showLogin();return;}
  await loadProfile(session.user.id);
}
function showLogin(){
  $("loginSection").classList.remove("hidden");
  $("portal").classList.add("hidden");
  $("logoutBtn").classList.add("hidden");
}
async function loadProfile(userId){
  const {data,error}=await db.from("worker_profiles")
    .select("id,worker_id,full_name,role,active")
    .eq("id",userId).maybeSingle();

  if(error || !data || !data.active || data.role==="admin"){
    await db.auth.signOut();
    showLogin();
    msg("loginMsg","This account is not an active worker account.", "error");
    return;
  }

  profile=data;
  $("loginSection").classList.add("hidden");
  $("portal").classList.remove("hidden");
  $("logoutBtn").classList.remove("hidden");
  $("workerName").textContent=data.full_name || "Worker";
  $("workerId").textContent=data.worker_id || "—";
  $("workerRole").textContent=data.role || "worker";
  $("saleDate").value=today();
  await loadSales();
}

async function loadSales(){
  const {data,error}=await db.from("sales")
    .select("*")
    .eq("worker_id",profile.id)
    .order("sale_date",{ascending:false});

  if(error){msg("saleMsg","Could not load your sales: "+error.message,"error");return;}

  const body=$("salesBody");
  if(!data || !data.length){
    body.innerHTML='<tr><td colspan="7">No sales recorded yet.</td></tr>';
    return;
  }
  body.innerHTML=data.map(s=>`<tr>
    <td>${esc(String(s.sale_date||"").slice(0,10))}</td>
    <td>${esc(s.customer_reference||"")}</td>
    <td>${esc(s.product_service||"")}</td>
    <td>${esc(s.quantity??"")}</td>
    <td>${Number(s.sale_amount||0).toFixed(2)}</td>
    <td>${esc(s.payment_method||"")}</td>
    <td>${esc(s.notes||"")}</td>
  </tr>`).join("");
}

$("loginBtn").onclick=async()=>{
  msg("loginMsg","Signing in...");
  const {data,error}=await db.auth.signInWithPassword({
    email:$("email").value.trim(),
    password:$("password").value
  });
  if(error){msg("loginMsg",error.message,"error");return;}
  await loadProfile(data.user.id);
};

$("logoutBtn").onclick=async()=>{
  await db.auth.signOut();
  profile=null;
  showLogin();
};

$("saleForm").onsubmit=async(e)=>{
  e.preventDefault();
  msg("saleMsg","Saving sale...");
  const sale={
    worker_id:profile.id,
    sale_date:$("saleDate").value,
    customer_reference:$("customer").value.trim() || null,
    product_service:$("product").value.trim(),
    quantity:Number($("quantity").value),
    sale_amount:Number($("amount").value),
    payment_method:$("payment").value,
    notes:$("notes").value.trim() || null
  };

  if(!sale.sale_date || !sale.product_service || sale.quantity<1 || sale.amount<0 || !sale.payment_method){
    msg("saleMsg","Please complete the required fields.","error");return;
  }

  const {error}=await db.from("sales").insert(sale);
  if(error){
    msg("saleMsg","Sale could not be saved: "+error.message,"error");
    return;
  }

  msg("saleMsg","Sale recorded successfully.","success");
  $("saleForm").reset();
  $("saleDate").value=today();
  $("quantity").value=1;
  await loadSales();
};

start();
</script>
</body>
</html>
